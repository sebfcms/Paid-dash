<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Paid Performance</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; color: #1e293b; font-size: 13px; }

    /* ── Login ── */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 24px; }
    .login-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 40px 48px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .login-logo { font-size: 32px; margin-bottom: 4px; }
    .login-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    .login-sub { font-size: 12px; color: #94a3b8; margin-bottom: 28px; }
    .login-error { font-size: 12px; color: #dc2626; margin-top: 14px; min-height: 18px; }

    /* ── Header ── */
    .header { background: #1e293b; color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 16px; font-weight: 700; }
    .header-meta { font-size: 11px; color: #94a3b8; margin-top: 3px; }
    .header-user { display: flex; align-items: center; gap: 12px; }
    .user-info { display: flex; align-items: center; gap: 9px; }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #475569; object-fit: cover; }
    .user-name { font-size: 12px; font-weight: 600; color: #e2e8f0; line-height: 1.2; }
    .user-email { font-size: 10px; color: #94a3b8; line-height: 1.2; }
    .btn-signout { background: none; border: 1px solid #475569; color: #94a3b8; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
    .btn-signout:hover { border-color: #94a3b8; color: #cbd5e1; }

    /* ── Tabs ── */
    .tabs { background: white; border-bottom: 2px solid #e2e8f0; padding: 0 48px; display: flex; gap: 2px; }
    .tab { padding: 11px 18px; cursor: pointer; font-size: 13px; font-weight: 500; color: #64748b; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; user-select: none; }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    .tab:hover:not(.active) { color: #374151; background: #f8fafc; }

    /* ── Month nav ── */
    .month-nav { background: white; border-bottom: 1px solid #e2e8f0; padding: 7px 48px; display: flex; align-items: center; gap: 10px; }
    .month-nav.hidden { display: none; }
    .mnav-btn { background: none; border: 1px solid #e2e8f0; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 16px; color: #475569; display: flex; align-items: center; justify-content: center; transition: background 0.15s; line-height: 1; }
    .mnav-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
    .mnav-btn:disabled { opacity: 0.25; cursor: default; }
    .mnav-label { font-size: 13px; font-weight: 700; color: #1e293b; min-width: 130px; text-align: center; }
    .mnav-tag { font-size: 10px; color: #94a3b8; font-weight: 500; }

    /* ── Layout avec sidebar décollée ── */
    .app-layout { display: flex; align-items: flex-start; background: #f1f5f9; }
    .app-main { flex: 1; min-width: 0; overflow: hidden; }
    .sidebar-outer {
      flex-shrink: 0;
      padding: 10px 10px 10px 0;
      position: sticky; top: 0; align-self: flex-start;
      max-height: calc(100vh - 120px); overflow-y: auto;
    }
    .sidebar {
      width: 440px; background: white;
      border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden;
    }
    .sidebar-hdr { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 1px; background: #f8fafc; }
    .sidebar-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #94a3b8; }
    .sidebar-mois { font-size: 14px; font-weight: 700; color: #0f172a; }
    .sidebar-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
    .sidebar-empty { font-size: 12px; color: #94a3b8; text-align: center; padding: 16px 0; line-height: 1.6; }
    .ctx-item { border-left: 3px solid #bfdbfe; padding: 6px 0 6px 12px; border-radius: 0; }
    .ctx-item.alerte   { border-color: #fca5a5; }
    .ctx-item.produit  { border-color: #6ee7b7; }
    .ctx-item.marche   { border-color: #c4b5fd; }
    .ctx-item.resultat { border-color: #fcd34d; }
    .ctx-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #3b82f6; }
    .ctx-item.alerte .ctx-lbl   { color: #dc2626; }
    .ctx-item.produit .ctx-lbl  { color: #059669; }
    .ctx-item.marche .ctx-lbl   { color: #7c3aed; }
    .ctx-item.resultat .ctx-lbl { color: #d97706; }
    .ctx-titre  { font-size: 13px; font-weight: 600; color: #0f172a; line-height: 1.35; margin-top: 3px; }
    .ctx-detail { font-size: 11px; color: #64748b; margin-top: 4px; line-height: 1.5; }
    .sidebar-hint { font-size: 10px; color: #94a3b8; padding: 10px 16px; border-top: 1px solid #f1f5f9; line-height: 1.5; }

    /* ── Content ── */
    .content { padding: 24px 48px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── KPI cards ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: white; border-radius: 10px; padding: 14px 16px; border: 1px solid #e2e8f0; }
    .kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; margin-bottom: 6px; }
    .kpi-value { font-size: 20px; font-weight: 800; color: #0f172a; line-height: 1.1; }
    .kpi-compare { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
    .kpi-compare-line { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: #64748b; }

    /* ── Section title ── */
    .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }

    /* ── Toggle leviers ── */
    .toggle-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .toggle-label { font-size: 11px; color: #64748b; }
    .toggle-switch { position: relative; display: inline-block; width: 36px; height: 20px; cursor: pointer; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 20px; transition: .2s; }
    .toggle-slider:before { content: ''; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .2s; }
    .toggle-switch input:checked + .toggle-slider { background: #2563eb; }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); }
    .toggle-tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #f1f5f9; color: #64748b; }
    .toggle-tag.on { background: #dbeafe; color: #1d4ed8; }

    /* ── Tables ── */
    .table-wrap { background: white; border-radius: 10px; border: 1px solid #e2e8f0; overflow: auto; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    thead th { background: #f8fafc; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; padding: 8px 9px; text-align: right; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    thead th.left { text-align: left; }
    thead th.group { background: #f1f5f9; text-align: center; color: #475569; }
    tbody td { padding: 7px 9px; text-align: right; border-bottom: 1px solid #f8fafc; font-size: 11px; color: #1e293b; }
    tbody td.left { text-align: left; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8fafc; }
    /* Liserés pointillés entre groupes — tbody uniquement */
    tbody td.sep { border-left: 1.5px dashed #94a3b8; }
    /* Valeurs Actuel */
    tbody td.act { font-size: 13px; font-weight: 700; color: #0f172a; }
    /* Lignes catégorie — plus hautes et bien distinctes */
    tbody tr.cat-row td { background: #f1f5f9; font-weight: 700; font-size: 11px; color: #374151; border-top: 1px solid #e2e8f0; padding-top: 10px; padding-bottom: 10px; }
    tbody tr.cat-row:hover td { background: #e8eef5; }
    /* Lignes leviers */
    tbody tr.levier-row td { font-size: 11px; color: #475569; }
    tbody tr.levier-row td.left { padding-left: 22px; }
    .na { color: #d1d5db; }
    .delta-up { color: #16a34a; font-weight: 600; font-size: 10px; }
    .delta-down { color: #dc2626; font-weight: 600; font-size: 10px; }
    .delta-neu { color: #9ca3af; font-weight: 600; font-size: 10px; }
    .cat-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; flex-shrink: 0; }
    .cat-chip { display: inline-flex; align-items: center; font-size: 10px; color: #94a3b8; margin-right: 3px; }

    /* ── Charts ── */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-card { background: white; border-radius: 10px; padding: 18px; border: 1px solid #e2e8f0; }
    .chart-title { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 14px; }
    .chart-wrap { height: 210px; position: relative; }

    /* ── Misc ── */
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 14px; color: #64748b; }
    .spinner { width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #dc2626; text-align: center; padding: 40px; }
    .prorate-note { font-size: 10px; color: #94a3b8; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 12px; margin-bottom: 16px; display: inline-block; }

    @media (max-width: 900px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; background: transparent; }
      .sidebar-outer { width: 100%; padding: 0 0 10px 0; position: static; max-height: none; overflow-y: visible; }
      .sidebar { width: 100%; border-radius: 0; border-left: none; border-right: none; }
      .sidebar-body { flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
      .ctx-item { min-width: 140px; flex: 1; }
    }
    @media (max-width: 600px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script>
// ═══════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════
let _idToken = null;

function handleCredentialResponse(response) {
  const token = response.credential;
  try {
    const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const payload = JSON.parse(decodeURIComponent(atob(b64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
    const email     = payload.email      || '';
    const name      = payload.name       || '';
    const givenName = payload.given_name || name;
    const picture   = payload.picture    || '';

    if (!email.endsWith('@figarocms.fr')) {
      document.getElementById('login-error').textContent =
        `Accès refusé : ${email} n'est pas un compte @figarocms.fr`;
      return;
    }
    _idToken = token;
    document.getElementById('hdr-name').textContent  = givenName;
    document.getElementById('hdr-email').textContent = email;
    if (picture) {
      const av = document.getElementById('hdr-avatar');
      av.src = picture; av.style.display = 'block';
    }
    fetch(APPS_SCRIPT_URL + '?action=log&email=' + encodeURIComponent(email) + '&name=' + encodeURIComponent(name)).catch(() => {});
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
    main();
  } catch(e) {
    document.getElementById('login-error').textContent = 'Erreur de connexion : ' + e.message;
  }
}

function signOut() {
  _idToken = null;
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-screen').style.display = 'flex';
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
const MONTH_NAMES = ['','Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const MONTH_FULL  = ['','Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

// Colgroup compact — largeurs minimales, table width:auto pour ne pas s'étirer
const COLGROUP = `<colgroup>
  <col style="width:88px">
  <col style="width:48px"><col style="width:52px"><col style="width:28px"><col style="width:38px"><col style="width:38px">
  <col style="width:48px"><col style="width:38px"><col style="width:38px">
  <col style="width:52px"><col style="width:38px"><col style="width:38px">
</colgroup>`;

const CAT_COLORS = {
  'SEA':          '#2563eb',
  'Agrégateurs':  '#f97316',
  'Retargeting':  '#ef4444',
  'Social':       '#a855f7',
  'Affiliation':  '#14b8a6',
  'Organic':      '#22c55e',
};

const CAT_ORDER = ['SEA','Agrégateurs','Retargeting','Social','Affiliation','Organic'];

function daysInMonth(m, y) { return new Date(y, m, 0).getDate(); }

function fmtK(v) {
  if (v == null || v === 0) return '<span class="na">—</span>';
  return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(v);
}
function fmtEuro(v) {
  if (v == null || v === 0) return '<span class="na">—</span>';
  return new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(v);
}
function fmtEuroCpa(v) {
  if (v == null) return '<span class="na">—</span>';
  return new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:2, minimumFractionDigits:2 }).format(v);
}
function fmtDelta(pct, invert=false) {
  if (pct == null) return '<span class="delta-neu">—</span>';
  const effective = invert ? -pct : pct;
  const sign = pct >= 0 ? '+' : '';
  const cls = effective > 1 ? 'delta-up' : effective < -1 ? 'delta-down' : 'delta-neu';
  return `<span class="${cls}">${sign}${pct.toFixed(1)}%</span>`;
}
function fmtPct(dep, bud) {
  if (!dep || !bud || bud <= 0) return '<span class="na">—</span>';
  const p = dep / bud * 100;
  const cls = p > 105 ? 'delta-down' : p >= 90 ? 'delta-up' : '';
  return `<span class="${cls || 'delta-neu'}">${p.toFixed(0)}%</span>`;
}
function pctDelta(cur, ref) {
  if (cur == null || ref == null || ref === 0) return null;
  return (cur - ref) / ref * 100;
}
function cpa(dep, rdm) {
  if (!dep || !rdm || dep <= 0 || rdm <= 0) return null;
  return dep / rdm;
}
function sortMois(arr) {
  return [...arr].sort((a, b) => {
    const [ma, ya] = a.split('/');
    const [mb, yb] = b.split('/');
    return (parseInt(ya)*12+parseInt(ma)) - (parseInt(yb)*12+parseInt(mb));
  });
}

// ═══════════════════════════════════════════════
// TOGGLE LEVIERS
// ═══════════════════════════════════════════════
function toggleLeviers(cb) {
  const panel = cb.closest('.tab-panel');
  if (!panel) return;
  panel.querySelectorAll('tr.levier-row').forEach(r => {
    r.style.display = cb.checked ? '' : 'none';
  });
  const tag = cb.closest('.toggle-bar').querySelector('.toggle-tag');
  tag.textContent = cb.checked ? 'Leviers visibles' : 'Catégories seules';
  tag.className   = cb.checked ? 'toggle-tag on' : 'toggle-tag';
}

function toggleBar() {
  return `<div class="toggle-bar">
    <span class="toggle-label">Afficher les leviers</span>
    <label class="toggle-switch">
      <input type="checkbox" onchange="toggleLeviers(this)">
      <span class="toggle-slider"></span>
    </label>
    <span class="toggle-tag">Catégories seules</span>
  </div>`;
}

// ═══════════════════════════════════════════════
// AGGREGATION
// ═══════════════════════════════════════════════
function aggregate(rows, mois) {
  const subset = rows.filter(r => r.mois === mois);
  const byCat = {}, byCan = {};
  for (const r of subset) {
    const dep = r.depenses ?? 0, rdm = r.rdm ?? 0, alrt = r.alertiste ?? 0;
    const cv = r.cv ?? 0, bud = r.budget ?? 0;
    const cat = r.categorie, can = r.canal;
    if (!byCat[cat]) byCat[cat] = { depenses:0, rdm:0, alertiste:0, cv:0, budget:0 };
    byCat[cat].depenses += dep; byCat[cat].rdm += rdm; byCat[cat].alertiste += alrt;
    byCat[cat].cv += cv; byCat[cat].budget += bud;
    if (!byCan[can]) byCan[can] = { categorie:cat, depenses:0, rdm:0, alertiste:0, cv:0, budget:0 };
    byCan[can].depenses += dep; byCan[can].rdm += rdm; byCan[can].alertiste += alrt;
    byCan[can].cv += cv; byCan[can].budget += bud;
  }
  const totDep  = Object.values(byCat).reduce((s,c) => s + c.depenses,  0);
  const totRdm  = Object.values(byCat).reduce((s,c) => s + c.rdm,       0);
  const totAlrt = Object.values(byCat).reduce((s,c) => s + c.alertiste, 0);
  const totCv   = Object.values(byCat).reduce((s,c) => s + c.cv,        0);
  const totBud  = Object.values(byCat).reduce((s,c) => s + c.budget,    0);
  return {
    total: { depenses:totDep, rdm:totRdm, alertiste:totAlrt, cv:totCv, budget:totBud, cpa:cpa(totDep,totRdm) },
    byCat, byCan
  };
}

// ═══════════════════════════════════════════════
// KPI CARD
// ═══════════════════════════════════════════════
function kpiCard(label, valHtml, deltaM1, deltaA1, m1Label, a1Label, invertDelta, extraHtml='') {
  return `<div class="kpi-card">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${valHtml}</div>
    ${extraHtml}
    <div class="kpi-compare">
      <div class="kpi-compare-line"><span>vs ${a1Label}</span>${fmtDelta(deltaA1, invertDelta)}</div>
      <div class="kpi-compare-line"><span>vs ${m1Label}</span>${fmtDelta(deltaM1, invertDelta)}</div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════
// TABLE FUSIONNÉE (cat-rows + levier-rows)
// col 2 = Budget (sep), col 7 = Actuel Rdm (sep+act), col 10 = Actuel CPA (sep+act)
// ═══════════════════════════════════════════════
function buildTable(cur, m1, a1, pro, metricKey, metricLabel, m1Label, a1Label) {
  const theadHtml = `<thead>
    <tr>
      <th class="left" rowspan="2">Canal</th>
      <th class="group" colspan="5">Dépenses</th>
      <th class="group" colspan="3">${metricLabel}</th>
      <th class="group" colspan="3">CPA ${metricLabel}</th>
    </tr>
    <tr>
      <th>Budget</th><th>Actuel</th><th>%</th><th>vs ${a1Label}</th><th>vs ${m1Label}</th>
      <th>Actuel</th><th>vs ${a1Label}</th><th>vs ${m1Label}</th>
      <th>Actuel</th><th>vs ${a1Label}</th><th>vs ${m1Label}</th>
    </tr>
  </thead>`;

  let rows = '';
  for (const cat of CAT_ORDER) {
    const cd = cur.byCat[cat]; if (!cd) continue;
    const md = m1.byCat[cat] || {}, ad = a1.byCat[cat] || {};
    const isOrg = cat === 'Organic';
    const val  = cd[metricKey] || 0;
    const mVal = md[metricKey] || 0;
    const aVal = ad[metricKey] || 0;
    const curCpa = cpa(cd.depenses, val);
    const mCpa   = cpa(md.depenses, mVal);
    const aCpa   = cpa(ad.depenses, aVal);
    const dot = `<span class="cat-dot" style="background:${CAT_COLORS[cat]||'#94a3b8'}"></span>`;

    // ── Ligne catégorie
    rows += `<tr class="cat-row">
      <td class="left">${dot}${cat}</td>
      <td class="sep">${isOrg ? '<span class="na">—</span>' : fmtEuro(cd.budget)}</td>
      <td class="act">${isOrg ? '<span class="na">—</span>' : fmtEuro(cd.depenses)}</td>
      <td>${isOrg ? '<span class="na">—</span>' : fmtPct(cd.depenses, cd.budget)}</td>
      <td>${isOrg ? '' : fmtDelta(pctDelta(cd.depenses, pro(ad.depenses)))}</td>
      <td>${isOrg ? '' : fmtDelta(pctDelta(cd.depenses, pro(md.depenses)))}</td>
      <td class="sep act">${fmtK(val)}</td>
      <td>${fmtDelta(pctDelta(val, pro(aVal)))}</td>
      <td>${fmtDelta(pctDelta(val, pro(mVal)))}</td>
      <td class="sep act">${isOrg ? '<span class="na">—</span>' : fmtEuroCpa(curCpa)}</td>
      <td>${isOrg ? '' : fmtDelta(pctDelta(curCpa, aCpa), true)}</td>
      <td>${isOrg ? '' : fmtDelta(pctDelta(curCpa, mCpa), true)}</td>
    </tr>`;

    // ── Lignes leviers (cachées par défaut)
    const canals = Object.entries(cur.byCan).filter(([, d]) => d.categorie === cat);
    const color  = CAT_COLORS[cat] || '#94a3b8';
    for (const [canal, lcd] of canals) {
      const lmd = m1.byCan[canal] || {}, lad = a1.byCan[canal] || {};
      const lVal  = lcd[metricKey] || 0;
      const lmVal = lmd[metricKey] || 0;
      const laVal = lad[metricKey] || 0;
      const lCurCpa = cpa(lcd.depenses, lVal);
      const lmCpa   = cpa(lmd.depenses, lmVal);
      const laCpa   = cpa(lad.depenses, laVal);
      rows += `<tr class="levier-row" style="display:none">
        <td class="left"><span class="cat-chip"><span class="cat-dot" style="background:${color}"></span></span>${canal}</td>
        <td class="sep">${isOrg ? '<span class="na">—</span>' : fmtEuro(lcd.budget)}</td>
        <td class="act">${isOrg ? '<span class="na">—</span>' : fmtEuro(lcd.depenses)}</td>
        <td>${isOrg ? '<span class="na">—</span>' : fmtPct(lcd.depenses, lcd.budget)}</td>
        <td>${isOrg ? '' : fmtDelta(pctDelta(lcd.depenses, pro(lad.depenses)))}</td>
        <td>${isOrg ? '' : fmtDelta(pctDelta(lcd.depenses, pro(lmd.depenses)))}</td>
        <td class="sep act">${fmtK(lVal)}</td>
        <td>${fmtDelta(pctDelta(lVal, pro(laVal)))}</td>
        <td>${fmtDelta(pctDelta(lVal, pro(lmVal)))}</td>
        <td class="sep act">${isOrg ? '<span class="na">—</span>' : fmtEuroCpa(lCurCpa)}</td>
        <td>${isOrg ? '' : fmtDelta(pctDelta(lCurCpa, laCpa), true)}</td>
        <td>${isOrg ? '' : fmtDelta(pctDelta(lCurCpa, lmCpa), true)}</td>
      </tr>`;
    }
  }

  return `${toggleBar()}<div class="table-wrap"><table>${COLGROUP}${theadHtml}<tbody>${rows}</tbody></table></div>`;
}

// ═══════════════════════════════════════════════
// RENDER — MOIS EN COURS
// ═══════════════════════════════════════════════
function renderMois(rows, curMois, pctElapsed, m1Mois, a1Mois, daysElapsed) {
  const cur = aggregate(rows, curMois);
  const m1  = aggregate(rows, m1Mois);
  const a1  = aggregate(rows, a1Mois);
  const pro = v => v != null ? v * pctElapsed : null;

  const [m1mm, m1yy] = m1Mois.split('/');
  const [a1mm, a1yy] = a1Mois.split('/');
  const m1Label = MONTH_NAMES[parseInt(m1mm)] + ' ' + m1yy.slice(2);
  const a1Label = MONTH_NAMES[parseInt(a1mm)] + ' ' + a1yy.slice(2);
  const t = cur.total;

  let html = pctElapsed < 1
    ? `<div class="prorate-note">⏱ Mois en cours : ${daysElapsed} j écoulés — M-1 et A-1 ramenés aux mêmes jours (×${(pctElapsed*100).toFixed(0)}%)</div>`
    : `<div class="prorate-note">✅ Mois complet — comparatifs sur la totalité du mois</div>`;

  html += `<div class="kpi-grid">
    ${kpiCard('Dépenses', fmtEuro(t.depenses), pctDelta(t.depenses, pro(m1.total.depenses)), pctDelta(t.depenses, pro(a1.total.depenses)), m1Label, a1Label, false,
      t.budget > 0 ? `<div style="font-size:11px;color:#64748b;margin:6px 0 2px">Budget <strong>${fmtEuro(t.budget)}</strong> · ${fmtPct(t.depenses, t.budget)} dépensé</div>` : '')}
    ${kpiCard('Rdm (candidatures)', fmtK(t.rdm), pctDelta(t.rdm, pro(m1.total.rdm)), pctDelta(t.rdm, pro(a1.total.rdm)), m1Label, a1Label, false)}
    ${kpiCard('Alertistes', fmtK(t.alertiste), pctDelta(t.alertiste, pro(m1.total.alertiste)), pctDelta(t.alertiste, pro(a1.total.alertiste)), m1Label, a1Label, false)}
    ${kpiCard('CV déposés', fmtK(t.cv), pctDelta(t.cv, pro(m1.total.cv)), pctDelta(t.cv, pro(a1.total.cv)), m1Label, a1Label, false)}
    ${kpiCard('CPA Rdm global', fmtEuroCpa(t.cpa), pctDelta(t.cpa, m1.total.cpa), pctDelta(t.cpa, a1.total.cpa), m1Label, a1Label, true)}
  </div>`;

  html += `<div class="section-title">Canaux &amp; leviers</div>`;
  html += buildTable(cur, m1, a1, pro, 'rdm', 'Rdm', m1Label, a1Label);
  document.getElementById('tab-mois').innerHTML = html;
}

// ═══════════════════════════════════════════════
// RENDER — ALERTISTES / CV
// ═══════════════════════════════════════════════
function renderConvTab(rows, tabId, metricKey, metricLabel, curMois, pctElapsed, m1Mois, a1Mois, daysElapsed) {
  const cur = aggregate(rows, curMois);
  const m1  = aggregate(rows, m1Mois);
  const a1  = aggregate(rows, a1Mois);
  const pro = v => v != null ? v * pctElapsed : null;

  const [m1mm, m1yy] = m1Mois.split('/');
  const [a1mm, a1yy] = a1Mois.split('/');
  const m1Label = MONTH_NAMES[parseInt(m1mm)] + ' ' + m1yy.slice(2);
  const a1Label = MONTH_NAMES[parseInt(a1mm)] + ' ' + a1yy.slice(2);

  const kpiM   = cur.total[metricKey] || 0;
  const kpiDep = cur.total.depenses;
  const kpiCpa = cpa(kpiDep, kpiM);
  const m1M    = m1.total[metricKey] || 0;
  const a1M    = a1.total[metricKey] || 0;

  let html = pctElapsed < 1
    ? `<div class="prorate-note">⏱ Mois en cours : ${daysElapsed} j écoulés — M-1 et A-1 ramenés aux mêmes jours (×${(pctElapsed*100).toFixed(0)}%)</div>`
    : `<div class="prorate-note">✅ Mois complet — comparatifs sur la totalité du mois</div>`;

  html += `<div class="kpi-grid">
    ${kpiCard('Dépenses', fmtEuro(kpiDep), pctDelta(kpiDep, pro(m1.total.depenses)), pctDelta(kpiDep, pro(a1.total.depenses)), m1Label, a1Label, false,
      cur.total.budget > 0 ? `<div style="font-size:11px;color:#64748b;margin:6px 0 2px">Budget <strong>${fmtEuro(cur.total.budget)}</strong> · ${fmtPct(kpiDep, cur.total.budget)} dépensé</div>` : '')}
    ${kpiCard(metricLabel, fmtK(kpiM), pctDelta(kpiM, pro(m1M)), pctDelta(kpiM, pro(a1M)), m1Label, a1Label, false)}
    ${kpiCard('CPA ' + metricLabel, fmtEuroCpa(kpiCpa), pctDelta(kpiCpa, cpa(m1.total.depenses, m1M)), pctDelta(kpiCpa, cpa(a1.total.depenses, a1M)), m1Label, a1Label, true)}
  </div>`;

  html += `<div class="section-title">Canaux &amp; leviers</div>`;
  html += buildTable(cur, m1, a1, pro, metricKey, metricLabel, m1Label, a1Label);
  document.getElementById(tabId).innerHTML = html;
}

// ═══════════════════════════════════════════════
// RENDER — ÉVOLUTION
// ═══════════════════════════════════════════════
function renderEvol(rows, allMois) {
  const months = allMois.slice(-13);
  const labels = months.map(m => {
    const [mm, yy] = m.split('/');
    return MONTH_NAMES[parseInt(mm)] + ' ' + yy.slice(2);
  });

  const catDatasets = CAT_ORDER.filter(c => c !== 'Organic').map(cat => ({
    label: cat,
    data: months.map(m => aggregate(rows, m).byCat[cat]?.depenses || 0),
    backgroundColor: (CAT_COLORS[cat] || '#94a3b8') + 'bb',
    borderColor:     CAT_COLORS[cat] || '#94a3b8',
    borderWidth: 1, stack: 'spend',
  }));

  const lastIdx = months.length - 1;
  document.getElementById('tab-evol').innerHTML = `
    <div class="charts-grid">
      <div class="chart-card"><div class="chart-title">🎯 Rdm par catégorie — empilés</div><div class="chart-wrap"><canvas id="chart-rdm-cat"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">🔔 Alertistes par catégorie — empilés</div><div class="chart-wrap"><canvas id="chart-alert-cat"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">📄 CV déposés par catégorie — empilés</div><div class="chart-wrap"><canvas id="chart-cv-cat"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">📊 Dépenses par catégorie — empilées</div><div class="chart-wrap"><canvas id="chart-cat"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">💡 CPA Rdm par catégorie — évolution</div><div class="chart-wrap"><canvas id="chart-cpa"></canvas></div></div>
    </div>`;

  const xScale = { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 45, color: '#64748b' } };
  const yScale = { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, color: '#64748b' } };
  const base   = { responsive: true, maintainAspectRatio: false, animation: false,
                   plugins: { legend: { display: false }, tooltip: { bodyFont: { size: 11 }, titleFont: { size: 11 } } } };

  new Chart(document.getElementById('chart-cpa'), {
    type: 'line',
    data: { labels, datasets: CAT_ORDER.filter(c => c !== 'Social' && c !== 'Organic').map(cat => {
      const color = CAT_COLORS[cat] || '#94a3b8';
      return { label: cat,
        data: months.map(m => { const c = aggregate(rows,m).byCat[cat]; return c ? cpa(c.depenses,c.rdm) : null; }),
        borderColor: color, backgroundColor: color+'18', tension: 0.3,
        pointRadius: months.map((_,i) => i===lastIdx?5:2), pointBackgroundColor: color, pointBorderWidth: 0, spanGaps: true };
    })},
    options: { ...base, plugins: { ...base.plugins,
      legend: { display: true, position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10, padding: 12 } } },
      scales: { x: xScale, y: { ...yScale, ticks: { ...yScale.ticks, callback: v => v!=null?v.toFixed(2)+' €':'' } } } }
  });

  new Chart(document.getElementById('chart-cat'), {
    type: 'bar', data: { labels, datasets: catDatasets },
    options: { ...base, plugins: { ...base.plugins,
      legend: { display: true, position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10, padding: 12 } } },
      scales: { x: { ...xScale, stacked: true }, y: { ...yScale, stacked: true, ticks: { ...yScale.ticks,
        callback: v => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',notation:'compact',maximumFractionDigits:0}).format(v) } } } }
  });

  const pctLabelPlugin = {
    id: 'pctLabel',
    afterDatasetsDraw(chart) {
      if (!chart.options.plugins?.pctLabel?.enabled) return;
      const SHOW = new Set(['SEA','Agrégateurs','Organic']);
      const ctx = chart.ctx;
      chart.data.datasets.forEach((dataset, dsIdx) => {
        if (!SHOW.has(dataset.label)) return;
        const meta = chart.getDatasetMeta(dsIdx);
        meta.data.forEach((bar, i) => {
          const total = chart.data.datasets.reduce((s,ds) => s+(ds.data[i]||0), 0);
          if (!total) return;
          const pct = Math.round((dataset.data[i]||0)/total*100);
          if (pct < 6) return;
          const props = bar.getProps(['x','y','width','height'], true);
          if (props.height < 13) return;
          ctx.save(); ctx.font = 'bold 8.5px -apple-system,sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 2;
          ctx.fillStyle = 'rgba(255,255,255,0.93)';
          ctx.fillText(pct+'%', props.x, props.y+props.height/2); ctx.restore();
        });
      });
    }
  };
  Chart.register(pctLabelPlugin);

  function makeConvStacked(metricKey) {
    return CAT_ORDER.map(cat => ({
      label: cat,
      data: months.map(m => aggregate(rows,m).byCat[cat]?.[metricKey] || 0),
      backgroundColor: (CAT_COLORS[cat]||'#94a3b8')+'bb',
      borderColor: CAT_COLORS[cat]||'#94a3b8', borderWidth: 1, stack: 'conv',
    }));
  }
  const stackedOpts = { ...base, plugins: { ...base.plugins,
    legend: { display: true, position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10, padding: 12 } },
    pctLabel: { enabled: true } },
    scales: { x: { ...xScale, stacked: true }, y: { ...yScale, stacked: true, ticks: { ...yScale.ticks,
      callback: v => new Intl.NumberFormat('fr-FR',{notation:'compact'}).format(v) } } } };

  new Chart(document.getElementById('chart-rdm-cat'),   { type:'bar', data:{labels, datasets:makeConvStacked('rdm')},       options:stackedOpts });
  new Chart(document.getElementById('chart-alert-cat'), { type:'bar', data:{labels, datasets:makeConvStacked('alertiste')}, options:stackedOpts });
  new Chart(document.getElementById('chart-cv-cat'),    { type:'bar', data:{labels, datasets:makeConvStacked('cv')},        options:stackedOpts });
}

// ═══════════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════════
function renderSidebar(mois) {
  const [mm, yyyy] = mois.split('/');
  document.getElementById('sidebar-mois').textContent = `${MONTH_FULL[parseInt(mm)]} ${yyyy}`;
  const TYPE_CLASS = { 'Alerte':'alerte', 'Levier':'', 'Produit':'produit', 'Marché':'marche', 'Résultat':'resultat' };
  const items = (_contexte || []).filter(c => c.mois === mois).sort((a,b) => (a.poids||5)-(b.poids||5));
  const body  = document.getElementById('sidebar-body');
  if (!items.length) {
    body.innerHTML = `<div class="sidebar-empty">Aucun événement.<br>Ajoutez des lignes dans l'onglet <em>Contexte</em>.</div>`;
    return;
  }
  body.innerHTML = items.map(item => `
    <div class="ctx-item ${TYPE_CLASS[item.type]??''}">
      <div class="ctx-lbl">${item.type}</div>
      <div class="ctx-titre">${item.titre}</div>
      ${item.detail ? `<div class="ctx-detail">${item.detail}</div>` : ''}
    </div>`).join('');
}

// ═══════════════════════════════════════════════
// NAVIGATION MOIS
// ═══════════════════════════════════════════════
let _rows=null, _allMois=null, _selMoisIdx=0, _contexte=[];

function navMonth(dir) {
  const next = _selMoisIdx + dir;
  if (next < 0 || next >= _allMois.length) return;
  _selMoisIdx = next;
  renderDetailTabs(_rows, _allMois, _allMois[_selMoisIdx]);
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('month-nav').classList.toggle('hidden', name==='evol');
}

function renderDetailTabs(rows, allMois, selMois) {
  const [smm, syyy] = selMois.split('/');
  const today       = new Date();
  const todayMois   = `${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
  const isCurrent   = selMois === todayMois;
  const totalDays   = daysInMonth(parseInt(smm), parseInt(syyy));
  const daysElapsed = isCurrent ? today.getDate() : totalDays;
  const pctElapsed  = daysElapsed / totalDays;

  let m1m = parseInt(smm)-1, m1y = parseInt(syyy);
  if (m1m === 0) { m1m = 12; m1y--; }
  const m1Mois = `${String(m1m).padStart(2,'0')}/${m1y}`;
  const a1Mois = `${String(smm).padStart(2,'0')}/${parseInt(syyy)-1}`;

  document.getElementById('hdr-title').textContent = `Dashboard Paid — ${MONTH_FULL[parseInt(smm)]} ${syyy}`;
  document.getElementById('hdr-meta').textContent  = isCurrent
    ? `J${daysElapsed}/${totalDays} (${(pctElapsed*100).toFixed(0)}% du mois) · Données au ${today.toLocaleDateString('fr-FR')} · Comparatifs proratés sur ${daysElapsed} jours`
    : `Mois complet · ${totalDays} jours · Bilan définitif`;
  document.getElementById('mnav-label').textContent = `${MONTH_FULL[parseInt(smm)]} ${syyy}`;
  document.getElementById('mnav-tag').textContent   = isCurrent ? '(mois en cours)' : '(mois complet)';
  document.getElementById('mnav-prev').disabled = _selMoisIdx === 0;
  document.getElementById('mnav-next').disabled = _selMoisIdx === allMois.length-1;

  renderMois(rows, selMois, pctElapsed, m1Mois, a1Mois, daysElapsed);
  renderConvTab(rows, 'tab-alertistes', 'alertiste', 'Alertistes', selMois, pctElapsed, m1Mois, a1Mois, daysElapsed);
  renderConvTab(rows, 'tab-cv', 'cv', 'CV déposés', selMois, pctElapsed, m1Mois, a1Mois, daysElapsed);
  renderSidebar(selMois);
}

// ═══════════════════════════════════════════════
// MAIN
// ═══════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxc64I1H3_zc30tLuaTMizABbPJ8fNFCVw3nfdJGYZES01IBCAN4KGK5gPkq0JDN0_PJg/exec';

async function main() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    if (!res.ok) throw new Error('Erreur HTTP ' + res.status);
    const { rows, error, contexte } = await res.json();
    if (error) throw new Error(error);
    if (!rows || !rows.length) throw new Error('Aucune donnée — vérifier la structure du fichier.');

    _contexte = contexte || [];
    const allMois = sortMois([...new Set(rows.map(r => r.mois))]);
    _rows = rows; _allMois = allMois; _selMoisIdx = allMois.length-1;

    renderDetailTabs(rows, allMois, allMois[_selMoisIdx]);
    renderEvol(rows, allMois);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div class="error">⚠️ Erreur : ${e.message}<br><small>${e.stack||''}</small></div>`;
  }
}
</script>
